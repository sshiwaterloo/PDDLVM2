[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pddlvm"
dynamic = ["version"]
description = "Physics-Driven Deep Latent Variable Models (PDDLVM) for PDE inverse problems"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Arnaud Vadeboncoeur" },
    { name = "Sammy Shi" },
]
requires-python = ">=3.9"
keywords = [
    "pde",
    "variational-inference",
    "inverse-problems",
    "bayesian",
    "latent-variable-model",
    "finite-elements",
    "scientific-machine-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "tensorflow>=2.13",
    "tensorflow-probability>=0.22",
    "numpy>=1.26",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
]

[tool.setuptools.packages.find]
include = ["pddlvm*"]

[tool.setuptools.dynamic]
version = { attr = "pddlvm.__version__" }

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    # E402: module-level import not at top of file (apps/* entry scripts keep
    # their sys.path introspection at the top; cleaned up in E1).
    "E402",
    # E501 is handled by the formatter; long docstring URLs etc.
    "E501",
]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
# The numeric layer is being refactored in E2; tighten to
# check_untyped_defs = true afterwards.
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["pddlvm/tests"]
addopts = "-ra"
